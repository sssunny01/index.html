
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.phase-tabs { display: flex; gap: 6px; margin: 1rem 0 1.25rem; flex-wrap: wrap; }
.phase-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
  border: 1.5px solid transparent; cursor: pointer; transition: all .2s;
  color: var(--color-text-secondary); background: var(--color-background-secondary);
}
.phase-tab:hover { background: var(--color-background-primary); border-color: var(--color-border-secondary); }
.phase-tab.active { color: var(--phase-text); background: var(--phase-bg); border-color: var(--phase-border); }

.phase-card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
}
.phase-header {
  padding: 1rem 1.25rem 0.875rem;
  border-left: 4px solid var(--phase-border);
}
.phase-title { font-size: 17px; font-weight: 500; color: var(--color-text-primary); }
.phase-days { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; margin-bottom: 10px; }

.metrics-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px;
}
.metric-box {
  background: var(--color-background-secondary);
  border-radius: var(--border-radius-md);
  padding: 8px 10px;
}
.metric-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.metric-value { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.meter { height: 5px; border-radius: 3px; background: var(--color-border-tertiary); margin-top: 5px; overflow: hidden; }
.meter-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

.efficiency-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 1.25rem;
  border-top: 0.5px solid var(--color-border-tertiary);
  background: var(--phase-bg);
}
.efficiency-label { font-size: 12px; color: var(--phase-text); font-weight: 500; white-space: nowrap; }
.eff-stars { display: flex; gap: 3px; }
.eff-star { width: 14px; height: 14px; border-radius: 2px; }
.eff-star.on { background: var(--phase-border); }
.eff-star.off { background: var(--color-border-tertiary); }
.eff-desc { font-size: 12px; color: var(--phase-text); opacity: .8; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.section { padding: 0.875rem 1.25rem; border-top: 0.5px solid var(--color-border-tertiary); }
.section:nth-child(2) { border-left: 0.5px solid var(--color-border-tertiary); }
.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--color-text-tertiary); font-weight: 500; margin-bottom: 8px;
}
.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 12px; }
.body-tag { background: var(--phase-bg-light); color: var(--phase-text); border: 0.5px solid var(--phase-border-light); }
.diet-tag { background: var(--color-background-secondary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-tertiary); }

.tips-section {
  padding: 0.875rem 1.25rem;
  border-top: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
}
.tip-row { display: flex; gap: 8px; margin-bottom: 5px; font-size: 13px; align-items: flex-start; }
.tip-row:last-child { margin-bottom: 0; }
.tip-icon { color: var(--phase-border); margin-top: 1px; flex-shrink: 0; font-size: 15px; }
.tip-text { color: var(--color-text-primary); line-height: 1.5; }

.cycle-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 0.75rem 0 0.25rem; }
.cycle-segment { transition: opacity .2s; cursor: pointer; }
.cycle-segment:hover { opacity: .75; }
.bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-tertiary); }
</style>

<div style="padding: 0.5rem 0 1.5rem;">
<h2 class="sr-only">생리주기별 다이어트 효율 및 신체변화 가이드</h2>

<div style="font-size:14px;color:var(--color-text-secondary);margin-bottom:12px;">생리주기 28일 — 단계를 선택하세요</div>

<div class="cycle-bar">
  <div class="cycle-segment" style="width:14%;background:#E24B4A;" onclick="setPhase(0)"></div>
  <div class="cycle-segment" style="width:29%;background:#EF9F27;" onclick="setPhase(1)"></div>
  <div class="cycle-segment" style="width:7%;background:#639922;" onclick="setPhase(2)"></div>
  <div class="cycle-segment" style="width:50%;background:#7F77DD;" onclick="setPhase(3)"></div>
</div>
<div class="bar-labels">
  <span>1일</span><span>7일</span><span>14일</span><span>21일</span><span>28일</span>
</div>

<div class="phase-tabs" id="tabs">
  <button class="phase-tab active" style="--phase-text:#A32D2D;--phase-bg:#FCEBEB;--phase-border:#E24B4A" onclick="setPhase(0)">🔴 생리기 (1–4일)</button>
  <button class="phase-tab" style="--phase-text:#854F0B;--phase-bg:#FAEEDA;--phase-border:#EF9F27" onclick="setPhase(1)">🟠 난포기 (5–13일)</button>
  <button class="phase-tab" style="--phase-text:#3B6D11;--phase-bg:#EAF3DE;--phase-border:#639922" onclick="setPhase(2)">🟢 배란기 (14–16일)</button>
  <button class="phase-tab" style="--phase-text:#3C3489;--phase-bg:#EEEDFE;--phase-border:#7F77DD" onclick="setPhase(3)">🟣 황체기 (17–28일)</button>
</div>

<div id="phase-content"></div>
</div>

<script>
const phases = [
  {
    name: "생리기", days: "1–4일", color: "#E24B4A",
    textColor: "#A32D2D", bgColor: "#FCEBEB", bgLight: "#FDF5F5", borderLight: "#F7C1C1",
    hormones: "에스트로겐·프로게스테론 최저",
    efficiency: 2,
    effDesc: "낮음 — 회복 우선, 감량 목표 보류",
    metrics: [
      { label: "다이어트 효율", value: "★★☆☆☆", fill: 40, color: "#E24B4A" },
      { label: "식욕 수준", value: "중간", fill: 55, color: "#EF9F27" },
      { label: "운동 효율", value: "낮음", fill: 30, color: "#E24B4A" },
    ],
    bodyChanges: ["복통·허리통증", "피로감 증가", "부종 완화 시작", "기초대사량 하강"],
    dietTags: ["철분 보충", "따뜻한 음식", "항염 식품", "카페인 줄이기"],
    tips: [
      { icon: "ti-flame", text: "운동 강도를 낮추고 요가·스트레칭 위주로 — 지나친 칼로리 제한은 피로를 악화시킵니다." },
      { icon: "ti-leaf", text: "시금치·두부·소고기로 철분 보충. 비타민C와 함께 먹으면 흡수율 상승." },
      { icon: "ti-droplet", text: "따뜻한 물·생강차로 혈액순환 촉진. 알코올과 짠 음식은 부종을 악화시킵니다." },
    ]
  },
  {
    name: "난포기", days: "5–13일", color: "#EF9F27",
    textColor: "#854F0B", bgColor: "#FAEEDA", bgLight: "#FEF9F0", borderLight: "#FAC775",
    hormones: "에스트로겐 상승",
    efficiency: 5,
    effDesc: "최고 — 칼로리 제한·운동 집중 최적기",
    metrics: [
      { label: "다이어트 효율", value: "★★★★★", fill: 100, color: "#639922" },
      { label: "식욕 수준", value: "낮음", fill: 35, color: "#639922" },
      { label: "운동 효율", value: "매우 높음", fill: 95, color: "#639922" },
    ],
    bodyChanges: ["에너지 수준 최고", "근육 합성 유리", "인슐린 감수성 좋음", "기분·집중력 향상"],
    dietTags: ["칼로리 제한 최적", "단백질 강화", "고강도 운동", "탄수화물 적절히"],
    tips: [
      { icon: "ti-trending-up", text: "다이어트 효과가 가장 잘 나타나는 시기. 칼로리 적자를 이때 집중시키세요." },
      { icon: "ti-barbell", text: "근력 운동·HIIT에 최적. 에스트로겐이 근육 회복을 돕습니다." },
      { icon: "ti-egg", text: "단백질 1.6–2g/kg 섭취로 근육량 유지. 식욕이 자연스럽게 줄어 공복 유지가 쉽습니다." },
    ]
  },
  {
    name: "배란기", days: "14–16일", color: "#639922",
    textColor: "#3B6D11", bgColor: "#EAF3DE", bgLight: "#F4FAE8", borderLight: "#C0DD97",
    hormones: "LH·에스트로겐 급상승",
    efficiency: 4,
    effDesc: "높음 — 운동 퍼포먼스 절정, 감량 유지",
    metrics: [
      { label: "다이어트 효율", value: "★★★★☆", fill: 80, color: "#639922" },
      { label: "식욕 수준", value: "낮음", fill: 40, color: "#639922" },
      { label: "운동 효율", value: "최고", fill: 100, color: "#639922" },
    ],
    bodyChanges: ["체온 0.3–0.5°C 상승", "신진대사 소폭 증가", "체력·활력 최대치", "약간의 부종 가능"],
    dietTags: ["아연 섭취", "항산화 식품", "수분 충분히", "가벼운 식단"],
    tips: [
      { icon: "ti-run", text: "체력과 에너지가 절정 — 가장 힘든 운동을 여기 배치하세요." },
      { icon: "ti-apple", text: "아연(굴·호박씨)과 항산화 식품(베리류·토마토)으로 난소 건강 지원." },
      { icon: "ti-droplet-filled", text: "체온 상승으로 수분 손실이 늘어납니다. 하루 2L 이상 물 섭취를 목표로." },
    ]
  },
  {
    name: "황체기", days: "17–28일", color: "#7F77DD",
    textColor: "#3C3489", bgColor: "#EEEDFE", bgLight: "#F5F4FF", borderLight: "#CECBF6",
    hormones: "프로게스테론 상승, 에스트로겐 변동",
    efficiency: 2,
    effDesc: "낮음 — 유지 전략, 무리한 감량 금지",
    metrics: [
      { label: "다이어트 효율", value: "★★☆☆☆", fill: 40, color: "#7F77DD" },
      { label: "식욕 수준", value: "높음", fill: 80, color: "#E24B4A" },
      { label: "운동 효율", value: "중간", fill: 55, color: "#EF9F27" },
    ],
    bodyChanges: ["기초대사량 +100–300kcal", "수분 저류·부종", "식욕·단 음식 욕구 증가", "PMS 증상"],
    dietTags: ["마그네슘 보충", "복합 탄수화물", "칼로리 소폭 증가", "소금 줄이기"],
    tips: [
      { icon: "ti-mood-smile", text: "식욕 증가는 정상 — 기초대사량도 올라가므로 100–200kcal 정도 더 먹어도 됩니다." },
      { icon: "ti-nut", text: "마그네슘(견과류·다크초콜릿·바나나)은 PMS 증상과 단 음식 욕구를 줄여줍니다." },
      { icon: "ti-salt", text: "나트륨 줄이고 칼륨(감자·아보카도)을 늘려 부종을 예방하세요. 카페인도 제한." },
    ]
  }
];

let current = 0;

function setPhase(idx) {
  current = idx;
  document.querySelectorAll('.phase-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  render();
}

function render() {
  const p = phases[current];

  const stars = Array.from({length:5}, (_,i) =>
    `<div class="eff-star ${i < p.efficiency ? 'on' : 'off'}"></div>`
  ).join('');

  const metricsHtml = p.metrics.map(m => `
    <div class="metric-box">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${m.value}</div>
      <div class="meter"><div class="meter-fill" style="width:${m.fill}%;background:${m.color};"></div></div>
    </div>
  `).join('');

  const bodyTags = p.bodyChanges.map(b => `<span class="tag body-tag">${b}</span>`).join('');
  const dietTags = p.dietTags.map(d => `<span class="tag diet-tag">${d}</span>`).join('');
  const tipRows = p.tips.map(t => `
    <div class="tip-row">
      <i class="ti ${t.icon} tip-icon"></i>
      <span class="tip-text">${t.text}</span>
    </div>
  `).join('');

  document.getElementById('phase-content').innerHTML = `
  <div class="phase-card" style="--phase-border:${p.color};--phase-bg:${p.bgColor};--phase-bg-light:${p.bgLight};--phase-border-light:${p.borderLight};--phase-text:${p.textColor}">
    <div class="phase-header">
      <div class="phase-title">${p.name}</div>
      <div class="phase-days">${p.days} &nbsp;·&nbsp; ${p.hormones}</div>
      <div class="metrics-row">${metricsHtml}</div>
    </div>
    <div class="efficiency-banner">
      <div class="eff-stars">${stars}</div>
      <span class="efficiency-label">다이어트 효율</span>
      <span class="eff-desc">${p.effDesc}</span>
    </div>
    <div class="grid-2">
      <div class="section">
        <div class="section-title">신체 변화</div>
        <div class="tag-list">${bodyTags}</div>
      </div>
      <div class="section">
        <div class="section-title">다이어트 전략</div>
        <div class="tag-list">${dietTags}</div>
      </div>
    </div>
    <div class="tips-section">${tipRows}</div>
  </div>`;
}

render();
</script>
